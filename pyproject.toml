[build-system]
requires = [
    'setuptools',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'pfdcm'
version = '3.1.22'
dependencies = [
    'fastapi[standard]==0.116.1',
    'pydantic-settings==2.10.1',
    'psutil==7.0.0',
    'pflogf==0.0.3',
    'pfstate==3.0.2',
    'pudb==2025.1',
    'WebOb==1.8.9',
    'pynetdicom==3.0.3',
    'pypx==3.11.22',
    'pfurl==2.3.0.1',
]

authors = [
    {name = 'Chuan-Heng Hsiao', email = 'hsiao.chuanheng@gmail.com'},
    {name = 'Rudolph Pienaar', email = 'rudolph.pienaar@gmail.com'},
]
description = 'ChRIS path-and-files dicom/PACS connector'
readme = 'README.md'
license = {file = 'LICENSE.txt'}
keywords = [
]
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Operating System :: OS Independent',
]
requires-python = ">= 3.10"

[project.urls]
# Homepage      = ''
# Documentation = ''
# Repository    = ''
# 'Bug Tracker' = ''
# Changelog = ''

[project.scripts]

[tool.setuptools.packages.find]
exclude = [
    'tests*',
]

[tool.pytest.ini_options]
log_cli         = true
log_cli_level   = "DEBUG"
log_format      = "%(asctime)s [%(levelname)-5.5s] %(module)s#%(funcName)s@%(lineno)d: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.flake8]
max-line-length = 100
extend-ignore = [
    # See https://github.com/PyCQA/pycodestyle/issues/373
    'E203',
]
exclude = [
    '.git',
    '__pycache__',
    '__init__.py',
    '.cc',
    '.github',
    '.pytest_cache',
    '.vscode',
    'nnextractor_pb2.py',
    'build',
    'dist',
]
